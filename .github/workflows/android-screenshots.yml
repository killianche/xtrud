# Скриншоты Android для RuStore — в эмуляторе на раннере GitHub.
#
# Владелец не ставит APK на свой телефон (2026-09-13), а карточке RuStore
# нужны снимки именно Android-интерфейса: iOS-скриншоты показывают другой
# системный шрифт и другие элементы. Эмулятор ставит уже проверенный APK из
# запуска «Android → APK/AAB», снимает экраны и сохраняет лог сбоев — это
# заодно первый запуск приложения на Android.
#
# Запуск: Actions → «Android → скриншоты» → указать ID запуска с APK.

name: Android → скриншоты

on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: "ID запуска «Android → APK/AAB» с APK (профиль android-test)"
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: android-screenshots
  cancel-in-progress: false

jobs:
  shots:
    name: Снять экраны
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Без KVM эмулятор x86_64 на раннере не стартует за разумное время.
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Скачать APK из запуска сборки
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.apk_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Эмулятор и съёмка
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/release/android-store-screenshots.sh

      - name: Сохранить снимки и логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xtrud-android-screenshots-${{ github.run_number }}
          path: screenshots
          retention-days: 14
