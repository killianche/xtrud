# Сборка Android на GitHub Actions — APK для проверки на телефоне и AAB для RuStore.
#
# Почему не на VDS: там нет JDK и Android SDK, а свободного места 7 ГБ — SDK и
# кэш Gradle туда не помещаются. На ubuntu-раннере GitHub Android SDK уже стоит,
# репозиторий публичный, поэтому минуты Linux не расходуются.
#
# Движок тот же, что у iOS: `eas build --local` (prebuild → Gradle), поэтому
# облачный лимит EAS не тратится.
#
# Подпись: ключ загрузки лежит в секретах репозитория
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS),
# оригинал — на VDS в /root/.config/xtrud/android-signing/. Потеря ключа
# означает невозможность обновлять уже опубликованное приложение.
#
# Запуск: Actions → «Android → APK/AAB» → Run workflow, выбрать профиль:
#   android-test    — APK, окружение production, ставится на телефон напрямую;
#   production-local — AAB для загрузки в RuStore.

name: Android → APK/AAB

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Профиль сборки"
        required: true
        default: "android-test"
        type: choice
        options:
          - android-test
          - production-local

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    name: Собрать Android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Кэш Gradle между прогонами: первая сборка тянет весь Android-инструментарий
      # и занимает почти час, повторная с кэшем — минуты.
      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            android-gradle-

      - name: Установить зависимости
        run: npm ci --no-audit --no-fund

      # SDK RuStore ставится как необязательная зависимость: если gitflic
      # недоступен, npm ci молча пропустит её. Для Android это означало бы
      # сборку без push — лучше упасть здесь, чем узнать на телефоне.
      - name: Проверить, что SDK RuStore на месте
        run: node -e "require.resolve('react-native-rustore-push/package.json')"

      - name: Гейт версии и конфигурации
        run: |
          node scripts/release/check-version-consistency.mjs --platform android
          npm run mobile:config:check

      - name: Подготовить ключ подписи (из секретов, не в Git)
        run: |
          set -euo pipefail
          mkdir -p credentials/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > credentials/android/upload.keystore
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("credentials.json", JSON.stringify({
              android: {
                keystore: {
                  keystorePath: "credentials/android/upload.keystore",
                  keystorePassword: process.env.ANDROID_KEYSTORE_PASSWORD,
                  keyAlias: process.env.ANDROID_KEY_ALIAS,
                  keyPassword: process.env.ANDROID_KEYSTORE_PASSWORD,
                },
              },
            }, null, 2));
          '
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # Firebase (push на Android через FCM): google-services.json в Git не
      # лежит. Пишем его из секрета вне проекта и передаём путь в
      # GOOGLE_SERVICES_JSON — его читает app.config.js. Без секрета сборка
      # останавливается: версия без push не должна уйти в Google Play молча.
      - name: Подготовить google-services.json (из секретов, не в Git)
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Нет секрета GOOGLE_SERVICES_JSON_BASE64 — push на Android не заработает"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/google-services.json"
          node -e 'const c=require(process.argv[1]);if(c.client[0].client_info.android_client_info.package_name!=="com.xtrud.app")process.exit(1)' "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      # Память Gradle. Стандартный шаблон Expo даёт демону MaxMetaspaceSize=512m,
      # и на сборке 2026-09-12 задача :expo-updates:kspReleaseKotlin упала с
      # OutOfMemoryError: Metaspace, после чего Gradle завис до конца отведённого
      # времени (два запуска по 60 и 120 минут). Файл в GRADLE_USER_HOME имеет
      # приоритет над gradle.properties сгенерированного проекта. У раннера 16 ГБ.
      - name: Настроить память Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          PROPS
          cat ~/.gradle/gradle.properties

      - name: Собрать (eas build --local)
        # Свой предел шага: зависший Gradle не должен съедать весь запуск.
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p build
          if [ "${{ github.event.inputs.profile }}" = "production-local" ]; then
            OUT=build/xtrud.aab
          else
            OUT=build/xtrud.apk
          fi
          # Рабочий каталог EAS не удаляется после сборки: из него берём
          # mapping.txt R8 (файл расшифровки падений для Google Play).
          export EAS_LOCAL_BUILD_SKIP_CLEANUP=1
          export EAS_LOCAL_BUILD_WORKINGDIR="$RUNNER_TEMP/eas-build"
          npx eas-cli build --platform android --profile "${{ github.event.inputs.profile }}" \
            --local --non-interactive --output "$OUT"
          ls -la "$OUT"
          MAPPING="$(find "$RUNNER_TEMP/eas-build" -path '*outputs/mapping/release/mapping.txt' | head -1)"
          if [ -n "$MAPPING" ]; then cp "$MAPPING" build/mapping.txt; ls -la build/mapping.txt; fi
          echo "ARTIFACT=$OUT" >> "$GITHUB_ENV"

      - name: Убрать ключ с раннера
        if: always()
        run: rm -rf credentials credentials.json

      - name: Сохранить сборку как артефакт (на 14 дней)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xtrud-android-${{ github.event.inputs.profile }}-${{ github.run_number }}
          path: |
            ${{ env.ARTIFACT }}
            build/mapping.txt
          if-no-files-found: warn
          retention-days: 14
