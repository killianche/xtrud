# Sprint 21.4 — Chat happy-path smoke-test.
#
# ⚠️  Pre-condition: на dev-БД должен быть прогнан
#     `supabase/seed-test/chat-fixture.sql` — он создаёт user с phone
#     +79991110001, у которого уже есть открытый chat.
#
# Запуск:
#   psql "$DATABASE_URL" -f supabase/seed-test/chat-fixture.sql
#   maestro test .maestro/chat-smoke.yaml
appId: com.xtrud.app
env:
  TEST_PHONE: "+7 999 111-00-01"
  TEST_OTP: "123456"
---
- runFlow: flows/01-auth.yaml
- runFlow: flows/06-chat.yaml
