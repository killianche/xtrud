# Sprint 16.1 — Auth flow: phone → OTP → попадаем в onboarding role screen.
#
# Sprint 1 заглушка OTP: любой 6-значный код принимается, реального SMS нет.
# Когда Sprint 2 включит реальный провайдер — этот flow нужно будет переделать
# на whitelisted test phone из Supabase Auth настроек.
appId: com.xtrud.app
---
- launchApp:
    clearState: true
    clearKeychain: true

# Экран phone.tsx
- assertVisible: "Вход в xtrud"
- tapOn:
    text: "+7 ___ ___-__-__"
- inputText: ${TEST_PHONE}
- tapOn: "Получить код"

# Экран verify.tsx
- assertVisible: "Введите код"
- tapOn: "000000"
- inputText: ${TEST_OTP}
- tapOn: "Подтвердить"

# После успеха onAuthStateChange → protected route → /(onboarding)/role
- assertVisible: "Как будем работать?"
