# Sprint 16.2 — Onboarding flow для роли «клиент».
#
# Префикс: пользователь уже на экране role.tsx (после 01-auth).
# Постфикс: пользователь на главном экране /(tabs)/, видит каталог категорий.
appId: com.xtrud.app
---
# Экран role.tsx
- assertVisible: "Как будем работать?"
- tapOn: "Я ищу мастера"
- tapOn: "Продолжить"

# После complete_onboarding мутации protected route ведёт на (tabs).
# На главной видим приветствие и блок «Категории».
- assertVisible:
    text: "Категории"
    timeout: 15000
- assertVisible: "Выберите, какой мастер вам нужен"
