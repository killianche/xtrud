# Sprint 16.3 — Создание заказа клиентом.
#
# Префикс: пользователь на главной /(tabs)/ как клиент (после 02-onboarding-client).
# Постфикс: заказ опубликован, мы вернулись на /(tabs)/orders и видим карточку.
#
# ⚠️ Категория и город выбираются по точному имени из env (TEST_CATEGORY, TEST_CITY).
#    Дефолты подобраны под seed `supabase/seed.sql`. Если в твоей среде другие
#    категории/города — переопредели через `maestro test --env`. См. README.
appId: com.xtrud.app
---
# Идём в таб «Заказы».
- tapOn: "Заказы"
- assertVisible:
    text: "Создать заказ"
    timeout: 10000
- tapOn: "Создать заказ"

# Экран orders/new.tsx
- assertVisible: "Новая заявка"

# Категория — chip с именем из env.
- tapOn: ${TEST_CATEGORY}

# Краткое название
- tapOn: "Заменить смеситель на кухне"
- inputText: "Smoke: заменить смеситель на кухне"
- hideKeyboard

# Подробное описание
- tapOn: "Что нужно сделать, в какие сроки, особенности задачи..."
- inputText: "Maestro smoke-test: проверка happy-path создания заказа."
- hideKeyboard

# Город — chip с именем из env. Прокручиваем, чтобы появился в видимой области.
- scrollUntilVisible:
    element:
      text: ${TEST_CITY}
    direction: DOWN
- tapOn: ${TEST_CITY}

# Срочность по умолчанию = flexible (Гибко). Бюджет = negotiable (По договорённости).
# Оба заполнены defaultValues — не трогаем.

- scrollUntilVisible:
    element:
      text: "Опубликовать заказ"
    direction: DOWN
- tapOn: "Опубликовать заказ"

# После создания router.back() возвращает на /(tabs)/orders. Карточка
# с нашим title должна появиться сверху списка.
- assertVisible:
    text: "Smoke: заменить смеситель на кухне"
    timeout: 15000
