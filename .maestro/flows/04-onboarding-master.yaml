# Sprint 18.2 — Onboarding flow для роли «мастер».
#
# Префикс: пользователь на экране role.tsx (после 01-auth).
# Постфикс: пользователь на главном /(tabs)/ как мастер — RoleSwitcher виден.
#
# Sprint 4 решил: категории L2 НЕ часть онбординг-визарда — мастер настраивает
# их позже из профиля. Завершение визарда = заполнить master-profile форму.
appId: com.xtrud.app
---
# Экран role.tsx
- assertVisible: "Как будем работать?"
- tapOn: "Я мастер"
- tapOn: "Продолжить"

# Экран master-profile.tsx — заполняем минимально-валидную форму.
- assertVisible:
    text: "Профиль мастера"
    timeout: 10000

# Имя
- tapOn: "Магомед"
- inputText: "Тест"
- hideKeyboard

# Фамилия
- tapOn: "Албогачиев"
- inputText: "Мастеров"
- hideKeyboard

# Город — chip с именем из env (см. config.yaml: TEST_CITY).
- scrollUntilVisible:
    element:
      text: ${TEST_CITY}
    direction: DOWN
- tapOn: ${TEST_CITY}

# О себе — multiline, placeholder длинный.
- tapOn: "Опыт в стройке от фундамента до кровли..."
- inputText: "Maestro smoke: тестовый мастер для E2E."
- hideKeyboard

# Опыт, лет — placeholder "5"
- scrollUntilVisible:
    element:
      text: "Опыт, лет"
    direction: DOWN
- tapOn: "5"
- inputText: "3"
- hideKeyboard

# Радиус по умолчанию 10 км, инструмент/транспорт по умолчанию false — не трогаем.

- scrollUntilVisible:
    element:
      text: "Завершить"
    direction: DOWN
- tapOn: "Завершить"

# После complete_master_onboarding mutation AuthGate увидит
# onboarding_completed_at и редиректнет на /(tabs)/.
# Мастер видит RoleSwitcher (master/client toggle).
- assertVisible:
    text: "Заказы"
    timeout: 15000
