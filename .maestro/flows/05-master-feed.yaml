# Sprint 18.3 — Master view: просмотр feed заказов.
#
# Префикс: пользователь на главной как мастер (после 04-onboarding-master).
# Постфикс: убедились, что master-side tabs работают и feed отрисовался.
#
# Заметка: тут НЕ отправляем отклик — реально функциональный отклик требует
# существующего заказа от другого клиента в БД. Это покрывается отдельным
# integration-тестом (Sprint 19+), который сначала сидит данные.
appId: com.xtrud.app
---
# Идём в таб «Заказы». На master-side он называется тоже «Заказы» в нижней
# навигации, но заголовок страницы — «Заявки».
- tapOn: "Заказы"
- assertVisible:
    text: "Заявки"
    timeout: 10000

# Master view имеет 3 таба-пилла: Новые / Я откликнулся / Меня выбрали.
- assertVisible: "Новые"
- assertVisible: "Я откликнулся"
- assertVisible: "Меня выбрали"

# Переключаемся на «Я откликнулся» — должен открыться (пустой или с
# карточками, неважно), без креша.
- tapOn: "Я откликнулся"

# И на «Меня выбрали».
- tapOn: "Меня выбрали"

# Возвращаемся на «Новые» — happy path фид заказов.
- tapOn: "Новые"
