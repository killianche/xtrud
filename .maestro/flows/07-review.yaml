# Sprint 22.3 — Review smoke-test: открыть completed-заказ → 5★ → отзыв.
#
# Префикс:
#   1. На dev-БД прогнан `supabase/seed-test/chat-fixture.sql`
#      (он создаёт также completed-order id=6666… без существующего отзыва).
#   2. Maestro логинится под client (+79991110001) через 01-auth.
#
# Постфикс: отзыв сохранён, секция «Ваш отзыв» появилась на странице заказа.
appId: com.xtrud.app
---
# После 01-auth + AuthGate попадаем в (tabs). Онбординг пропускается
# (fixture проставил onboarding_completed_at).
- assertVisible:
    text: "Заказы"
    timeout: 15000

# Идём в таб «Заказы» (нижняя навигация).
- tapOn: "Заказы"

# Заголовок client view = «Мои заказы».
- assertVisible:
    text: "Мои заказы"
    timeout: 10000

# Tap по карточке завершённого заказа.
- scrollUntilVisible:
    element:
      text: "Установка ванны (smoke review)"
    direction: DOWN
- tapOn: "Установка ванны (smoke review)"

# Страница order detail. Поскольку status='completed' + isOwner → видна
# секция «Оцените мастера».
- assertVisible:
    text: "Оцените мастера"
    timeout: 10000

# 5 звёзд имеют accessibilityLabel `1 звёзд` … `5 звёзд` — Maestro находит.
- tapOn: "5 звёзд"

# Опционально пишем текст отзыва.
- tapOn: "Расскажите о работе мастера (опц.)"
- inputText: "Maestro smoke: мастер отлично справился."
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Оставить отзыв"
    direction: DOWN
- tapOn: "Оставить отзыв"

# После сохранения секция меняется на «Ваш отзыв» (готовый карточный вид).
- assertVisible:
    text: "Ваш отзыв"
    timeout: 15000
- assertVisible: "Maestro smoke: мастер отлично справился."
