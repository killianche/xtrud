# Sprint E — Order edit smoke: открыть open-заказ → правка → save.
#
# Префикс:
#   1. `supabase/seed-test/chat-fixture.sql` прогнан (создаёт open order
#      id=8888… с title «Edit smoke: проверить трубу»).
#   2. Maestro логинится под client +79991110001 через 01-auth.
#
# Постфикс: title заказа обновлён, мы вернулись на страницу order detail
# и видим новый title.
appId: com.xtrud.app
---
# После 01-auth + AuthGate → (tabs).
- assertVisible:
    text: "Заказы"
    timeout: 15000

- tapOn: "Заказы"
- assertVisible:
    text: "Мои заказы"
    timeout: 10000

# Открываем open-заказ.
- scrollUntilVisible:
    element:
      text: "Edit smoke: проверить трубу"
    direction: DOWN
- tapOn: "Edit smoke: проверить трубу"

# На странице order detail видим title + кнопку «Редактировать заказ»
# (accessibilityLabel на иконке-карандаше; видна только при status=open + isOwner).
- assertVisible: "Edit smoke: проверить трубу"
- tapOn: "Редактировать заказ"

# Edit screen.
- assertVisible:
    text: "Редактирование"
    timeout: 10000

# Title в форме уже заполнен текущим значением. Тапаем по нему и подставляем
# новый. Maestro находит TextInput по содержимому (если RN отдаёт value
# в accessibility tree).
- tapOn: "Edit smoke: проверить трубу"
# inputText НЕ заменяет — он добавляет. Сначала очищаем через eraseText.
- eraseText: 100
- inputText: "Edit smoke: трубу заменили (edited)"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Сохранить"
    direction: DOWN
- tapOn: "Сохранить"

# После router.back() возвращаемся на order detail. Новый title виден.
- assertVisible:
    text: "Edit smoke: трубу заменили (edited)"
    timeout: 15000
