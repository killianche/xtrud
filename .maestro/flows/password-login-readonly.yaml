appId: com.xtrud.app
name: Password login and client read-only navigation
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Профиль"
- tapOn: "Войти по телефону"
- assertVisible: "Вход в xtrud"
- tapOn:
    text: "example@mail.ru или +7 999…"
- inputText: "${E2E_LOGIN}"
- tapOn:
    text: "Ваш пароль"
- inputText: "${E2E_PASSWORD}"
- tapOn: "Войти"
- assertVisible:
    text: "Главная"
    timeout: 20000
- tapOn: "Профиль"
- assertVisible:
    text: "Настройки"
    timeout: 10000
- tapOn: "Главная"
- assertVisible: "Создать задание бесплатно"
- tapOn: "Заказы"
- assertVisible: "Мои заказы"
