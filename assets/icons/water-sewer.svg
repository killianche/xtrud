<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wsPipe" x1="14" y1="10" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset="0.5" stop-color="#2f8fe6"/>
      <stop offset="1" stop-color="#1769c4"/>
    </linearGradient>
    <linearGradient id="wsValve" x1="13" y1="6" x2="23" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9e3ff"/>
      <stop offset="1" stop-color="#3f9ff0"/>
    </linearGradient>
    <linearGradient id="wsDrop" x1="31" y1="30" x2="37" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aadcff"/>
      <stop offset="1" stop-color="#2f9bef"/>
    </linearGradient>
  </defs>

  <!-- мягкая опорная тень -->
  <ellipse cx="20" cy="40.5" rx="11" ry="2.4" fill="#0b3a66" opacity="0.12"/>

  <!-- настенное крепление -->
  <rect x="6" y="15" width="5" height="14" rx="2.5" fill="url(#wsPipe)"/>

  <!-- горизонтальная труба + изгиб вниз (излив) -->
  <path d="M9 19 H30 Q34 19 34 23 V29"
        stroke="url(#wsPipe)" stroke-width="6.5" stroke-linecap="round" fill="none"/>

  <!-- вертикальная стойка-кран -->
  <rect x="14.5" y="11" width="6.5" height="13" rx="3.25" fill="url(#wsPipe)"/>

  <!-- вентиль-маховик сверху -->
  <circle cx="17.75" cy="9.5" r="4.6" fill="url(#wsValve)"/>
  <rect x="16.85" y="5.6" width="1.8" height="7.8" rx="0.9" fill="#ffffff" opacity="0.85"/>
  <rect x="13.85" y="8.6" width="7.8" height="1.8" rx="0.9" fill="#ffffff" opacity="0.85"/>

  <!-- блик на стойке -->
  <rect x="15.6" y="12" width="1.6" height="10.5" rx="0.8" fill="#ffffff" opacity="0.45"/>

  <!-- капля воды под изливом -->
  <path d="M34 30 C34 30 39 35.5 39 38.3 A5 5 0 0 1 29 38.3 C29 35.5 34 30 34 30 Z"
        fill="url(#wsDrop)"/>
  <ellipse cx="32" cy="37.2" rx="1.4" ry="2" fill="#ffffff" opacity="0.5"/>
</svg>
