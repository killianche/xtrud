<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>xtrud · Linear design — clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; min-height: 100%; }
  * { box-sizing: border-box; }
  .stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .phone {
    width: 402px; height: 874px; background: #FAFAFA;
    border-radius: 48px; overflow: hidden; position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 10px #1a1a1a, 0 0 0 12px #333;
  }
  /* Notch */
  .phone::before {
    content: ""; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 32px; background: #000; border-radius: 20px; z-index: 100;
  }
  /* Status bar inset */
  .phone-inner { width: 100%; height: 100%; padding-top: 56px; position: relative; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
// ─────────────────────────────────────────────────────────────
// Иконки (Gravity UI стиль — line, stroke 1.5–2px)
// ─────────────────────────────────────────────────────────────
const Icon = ({ size = 20, color = "currentColor", strokeWidth = 1.5, children }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, display: "block" }}>
    {children}
  </svg>
);

const IconHouse = (p) => (<Icon {...p}><path d="M3 11l9-7 9 7v9a2 2 0 01-2 2h-4v-7h-6v7H5a2 2 0 01-2-2v-9z"/></Icon>);
const IconBolt  = (p) => (<Icon {...p}><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></Icon>);
const IconBrick = (p) => (<Icon {...p}><rect x="3" y="4" width="18" height="5"/><rect x="3" y="9" width="18" height="5"/><rect x="3" y="14" width="18" height="5"/><path d="M9 4v5M15 9v5M9 14v5M15 4v5"/></Icon>);
const IconGrid  = (p) => (<Icon {...p}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></Icon>);
const IconPaint = (p) => (<Icon {...p}><path d="M7 21l-3-3 11-11 3 3-11 11zM14 4l3 3M3 21h7"/></Icon>);
const IconBell  = (p) => (<Icon {...p}><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 004 0"/></Icon>);
const IconPin   = (p) => (<Icon {...p}><path d="M12 21s-7-7.5-7-12a7 7 0 1114 0c0 4.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></Icon>);
const IconBookmark = (p) => (<Icon {...p}><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2v16z"/></Icon>);
const IconArrowRight = (p) => (<Icon {...p}><path d="M5 12h14M12 5l7 7-7 7"/></Icon>);
const IconList = (p) => (<Icon {...p}><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></Icon>);
const IconBriefcase = (p) => (<Icon {...p}><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></Icon>);
const IconMessage = (p) => (<Icon {...p}><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"/></Icon>);
const IconUser = (p) => (<Icon {...p}><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>);

// ─────────────────────────────────────────────────────────────
// Linear-style Orders Feed
// ─────────────────────────────────────────────────────────────
const LinearStyle = () => {
  const orders = [
    { idx: "01", title: "Капремонт 2-к квартиры под ключ", category: "Ремонт", area: "Хамовники · 68 м²", budget: "1 850 000", deadline: "15 авг", days: 84, responses: 7, status: "NEW", posted: "12m", Ic: IconHouse },
    { idx: "02", title: "Демонтаж и стяжка офиса 240 м²", category: "Демонтаж", area: "Пресненская наб., 8с1", budget: "640 000", deadline: "30 июн", days: 38, responses: 12, status: "URGENT", posted: "1h", urgent: true, Ic: IconBrick },
    { idx: "03", title: "Замена электропроводки в доме", category: "Электрика", area: "Истра, КП «Сосны»", budget: "320 000", deadline: "5 июл", days: 43, responses: 4, status: "NEW", posted: "3h", Ic: IconBolt },
    { idx: "04", title: "Укладка кварцвинила, материал клиента", category: "Полы", area: "ЖК «Прайм Парк»", budget: "210 000", deadline: "20 июн", days: 28, responses: 2, status: "NEW", posted: "5h", Ic: IconGrid },
    { idx: "05", title: "Малярные работы и декоративная штукатурка", category: "Отделка", area: "Патриаршие пруды", budget: "480 000", deadline: "12 июл", days: 50, responses: 18, status: "OPEN", posted: "1d", Ic: IconPaint },
  ];

  const statusColor = (s) => {
    if (s === "NEW") return { bg: "#EEF2FF", fg: "#4F46E5", dot: "#6366F1" };
    if (s === "URGENT") return { bg: "#FEF2F2", fg: "#DC2626", dot: "#EF4444" };
    return { bg: "#F0FDF4", fg: "#15803D", dot: "#22C55E" };
  };

  return (
    <div style={{ width: "100%", height: "100%", background: "#FAFAFA", fontFamily: "'Inter', -apple-system, system-ui, sans-serif", color: "#0A0A0A", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      {/* Header */}
      <div style={{ padding: "10px 20px 14px", background: "#fff", borderBottom: "1px solid #ECECEC" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ width: 22, height: 22, borderRadius: 6, background: "linear-gradient(135deg,#5E6AD2,#8B5CF6)" }}></div>
            <div style={{ fontSize: 15, fontWeight: 600, letterSpacing: "-0.01em" }}>xtrud</div>
            <div style={{ marginLeft: 4, fontSize: 12, color: "#737373", padding: "2px 7px", border: "1px solid #ECECEC", borderRadius: 4, display: "flex", alignItems: "center", gap: 4 }}>
              Москва
              <svg width="8" height="8" viewBox="0 0 10 10" fill="none"><path d="M2 4l3 3 3-3" stroke="#737373" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <div style={{ width: 32, height: 32, borderRadius: 8, background: "#F4F4F5", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <IconBell size={15} color="#0A0A0A" strokeWidth={1.8} />
            </div>
            <div style={{ width: 32, height: 32, borderRadius: 8, background: "#0A0A0A", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 600 }}>СБ</div>
          </div>
        </div>
        <div style={{ fontSize: 11, color: "#737373", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4 }}>Лента заказов</div>
        <h1 style={{ fontSize: 26, fontWeight: 600, margin: 0, letterSpacing: "-0.025em", lineHeight: 1.15 }}>
          248 активных проектов
          <span style={{ display: "block", color: "#737373", fontWeight: 400 }}>обновлено секунду назад</span>
        </h1>
        {/* Stat strip */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 14 }}>
          {[
            { l: "Средний бюджет", v: "540K", t: "₽" },
            { l: "Откликов / час", v: "32", t: "" },
            { l: "Win-rate", v: "28%", t: "" },
          ].map((s) => (
            <div key={s.l} style={{ padding: "10px 12px", background: "#FAFAFA", border: "1px solid #ECECEC", borderRadius: 10 }}>
              <div style={{ fontSize: 10, color: "#737373", textTransform: "uppercase", letterSpacing: "0.08em" }}>{s.l}</div>
              <div style={{ fontSize: 17, fontWeight: 600, marginTop: 2, fontVariantNumeric: "tabular-nums", letterSpacing: "-0.01em" }}>
                {s.v}{s.t && <span style={{ fontSize: 11, color: "#737373", marginLeft: 2 }}>{s.t}</span>}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Filter row */}
      <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "12px 20px", background: "#fff", borderBottom: "1px solid #ECECEC", overflowX: "auto" }}>
        <div style={{ padding: "5px 11px", background: "#0A0A0A", color: "#fff", fontSize: 12, fontWeight: 500, borderRadius: 6 }}>Все</div>
        {["Ремонт", "Электрика", "Отделка", "Сантехника", "Демонтаж"].map((c) => (
          <div key={c} style={{ padding: "5px 11px", color: "#525252", fontSize: 12, fontWeight: 500, border: "1px solid #ECECEC", borderRadius: 6, whiteSpace: "nowrap" }}>{c}</div>
        ))}
      </div>

      {/* List */}
      <div style={{ flex: 1, overflowY: "auto", padding: "8px 0 100px" }}>
        {orders.map((o) => {
          const sc = statusColor(o.status);
          const Ic = o.Ic;
          return (
            <div key={o.idx} style={{ padding: "16px 20px", borderBottom: "1px solid #ECECEC", background: "#fff" }}>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                <div style={{ fontSize: 11, color: "#A3A3A3", fontVariantNumeric: "tabular-nums", marginTop: 3, minWidth: 22, fontWeight: 500 }}>{o.idx}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
                    <div style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "2px 7px", background: sc.bg, color: sc.fg, borderRadius: 4, fontSize: 10, fontWeight: 600, letterSpacing: "0.04em" }}>
                      <span style={{ width: 5, height: 5, borderRadius: "50%", background: sc.dot }}></span>
                      {o.status}
                    </div>
                    <div style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, color: "#737373" }}>
                      <Ic size={11} color="#737373" strokeWidth={1.8} />
                      {o.category}
                    </div>
                    <div style={{ flex: 1 }}></div>
                    <div style={{ fontSize: 11, color: "#A3A3A3", fontVariantNumeric: "tabular-nums" }}>{o.posted}</div>
                  </div>
                  <div style={{ fontSize: 15, fontWeight: 600, color: "#0A0A0A", lineHeight: 1.35, letterSpacing: "-0.01em", marginBottom: 6 }}>{o.title}</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: "#737373", marginBottom: 10 }}>
                    <IconPin size={11} color="#737373" strokeWidth={1.8} />
                    {o.area}
                  </div>

                  {/* Numbers row */}
                  <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "10px 0", borderTop: "1px dashed #ECECEC" }}>
                    <div style={{ flexShrink: 0 }}>
                      <div style={{ fontSize: 9, color: "#A3A3A3", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 1 }}>Бюджет</div>
                      <div style={{ fontSize: 14, fontWeight: 600, fontVariantNumeric: "tabular-nums", letterSpacing: "-0.01em", whiteSpace: "nowrap" }}>₽ {o.budget}</div>
                    </div>
                    <div style={{ width: 1, height: 22, background: "#ECECEC", flexShrink: 0 }}></div>
                    <div style={{ flexShrink: 0 }}>
                      <div style={{ fontSize: 9, color: "#A3A3A3", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 1 }}>Срок</div>
                      <div style={{ fontSize: 14, fontWeight: 600, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{o.deadline}<span style={{ color: "#A3A3A3", fontWeight: 400 }}> · {o.days}д</span></div>
                    </div>
                    <div style={{ width: 1, height: 22, background: "#ECECEC", flexShrink: 0 }}></div>
                    <div style={{ flexShrink: 0 }}>
                      <div style={{ fontSize: 9, color: "#A3A3A3", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 1 }}>Отклики</div>
                      <div style={{ fontSize: 14, fontWeight: 600, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{o.responses}<span style={{ color: "#A3A3A3", fontWeight: 400 }}>/20</span></div>
                    </div>
                  </div>
                  {/* CTA row */}
                  <div style={{ display: "flex", gap: 6, paddingTop: 4 }}>
                    <button style={{ flex: 1, padding: "9px 12px", background: "#0A0A0A", color: "#fff", border: "none", borderRadius: 7, fontSize: 12, fontWeight: 500, fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 5 }}>
                      Откликнуться <IconArrowRight size={12} color="#fff" strokeWidth={2} />
                    </button>
                    <button style={{ padding: "9px 12px", background: "#fff", color: "#525252", border: "1px solid #ECECEC", borderRadius: 7, fontSize: 12, fontWeight: 500, fontFamily: "inherit", display: "flex", alignItems: "center", gap: 5 }}>
                      <IconBookmark size={13} color="#525252" strokeWidth={1.8} />
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Bottom nav */}
      <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: "rgba(255,255,255,0.85)", backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)", borderTop: "1px solid #ECECEC", padding: "8px 0 28px", display: "flex", justifyContent: "space-around" }}>
        {[
          { l: "Лента", Ic: IconList, active: true },
          { l: "Заявки", Ic: IconBriefcase },
          { l: "Чаты", Ic: IconMessage },
          { l: "Профиль", Ic: IconUser },
        ].map((t) => {
          const Ic = t.Ic;
          return (
            <div key={t.l} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3, color: t.active ? "#0A0A0A" : "#A3A3A3" }}>
              <Ic size={22} strokeWidth={1.8} />
              <div style={{ fontSize: 10, fontWeight: 500 }}>{t.l}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

// ─────────────────────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────────────────────
const App = () => (
  <div className="stage">
    <div className="phone">
      <div className="phone-inner">
        <LinearStyle />
      </div>
    </div>
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
