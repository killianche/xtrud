# /opt/xtrud/xtrud-api/compose.yml на Beget. Секреты — в /opt/xtrud/xtrud-api.env.
services:
  xtrud-api:
    build: .
    container_name: xtrud-api
    restart: unless-stopped
    env_file: /opt/xtrud/xtrud-api.env
    mem_limit: 512m
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - /opt/xtrud/files:/data/files
    networks:
      - supabase_default
  xtrud-imgproxy:
    image: darthsim/imgproxy:v3.30.1
    container_name: xtrud-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /files
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "16.8"
      IMGPROXY_ALLOW_ORIGIN: "*"
    volumes:
      - /opt/xtrud/files:/files:ro
    ports:
      - "127.0.0.1:8101:8080"
    networks:
      - supabase_default
networks:
  supabase_default:
    external: true
